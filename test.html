<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Carousel Clean</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial;
  overflow-x: hidden;
}

/* ===== RENAMED BLOCKS ===== */
.page-block {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}

.block-top {
  background: #eee;
}

.block-bottom {
  background: #000;
  color: #fff;
}

/* ===== CAROUSEL ===== */
.carousel-wrapper {
  position: relative;
}

.carousel-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
  background: #fff;
}

.carousel {
  height: 100%;
  transition: transform 0.6s ease;
}

.slide {
  height: 100vh;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* DOTS */
.dots {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.dot {
  width: 10px;
  height: 10px;
  background: #aaa;
  border-radius: 50%;
  cursor: pointer;
}

.dot.active {
  background: #000;
  transform: scale(1.4);
}
</style>
</head>

<body>

<!-- TOP -->
<section class="page-block block-top">
  Top Block
</section>

<!-- CAROUSEL -->
<section class="carousel-wrapper" id="wrapper">
  <div class="carousel-sticky">

    <div class="carousel" id="carousel">
      <div class="slide"><img src="https://picsum.photos/id/1015/1920/1080"></div>
      <div class="slide"><img src="https://picsum.photos/id/1016/1920/1080"></div>
      <div class="slide"><img src="https://picsum.photos/id/1018/1920/1080"></div>
    </div>

    <div class="dots" id="dots"></div>

  </div>
</section>

<!-- BOTTOM -->
<section class="page-block block-bottom">
  Bottom Block
</section>

<script>
const carousel = document.getElementById("carousel");
const slides = document.querySelectorAll(".slide");
const wrapper = document.getElementById("wrapper");
const dotsContainer = document.getElementById("dots");

let currentIndex = 0;
const totalSlides = slides.length;

/* SET HEIGHT */
wrapper.style.height = `${(totalSlides - 1) * 100}vh`;
/* DOTS */
slides.forEach((_, i) => {
  const dot = document.createElement("div");
  dot.classList.add("dot");

  if (i === 0) dot.classList.add("active");

  dot.onclick = () => {
    currentIndex = i;
    update();
  };

  dotsContainer.appendChild(dot);
});

function updateDots() {
  document.querySelectorAll(".dot").forEach((dot, i) => {
    dot.classList.toggle("active", i === currentIndex);
  });
}

function update() {
  carousel.style.transform = `translateY(-${currentIndex * 100}vh)`;
  updateDots();
}

/* SCROLL CONTROL */
window.addEventListener("scroll", () => {
  const rect = wrapper.getBoundingClientRect();

  const progress = Math.min(
    Math.max(-rect.top / window.innerHeight, 0),
    totalSlides - 1
  );

  const index = Math.round(progress);

  if (index !== currentIndex) {
    currentIndex = index;
    update();
  }
});
</script>

</body>
</html>
